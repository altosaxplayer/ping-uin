name: release

# Build native binaries for macOS, Linux, and Windows on every `v*` tag.
# These artifacts are what the packagers (Homebrew tap + winget) consume.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          # macOS (Apple silicon) + Intel
          - name: macos-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
          # Linux x64
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Windows x64
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload license + checksum
        shell: bash
        run: |
          echo "Built ${{ matrix.target }}"

      # macOS/Linux: tar.gz with `ping-uin` binary + LICENSE
      - name: Package unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/ping-uin-${{ matrix.name }}.tar.gz" ping-uin

      # Windows: zip with `ping-uin.exe` binary + LICENSE
      - name: Package windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/ping-uin.exe", "LICENSE" `
            -DestinationPath "dist/ping-uin-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist/

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macOS-aarch64/ping-uin-*.tar.gz
            dist/macOS-x86_64/ping-uin-*.tar.gz
            dist/linux-x86_64/ping-uin-*.tar.gz
            dist/windows-x86_64/ping-uin-*.zip
