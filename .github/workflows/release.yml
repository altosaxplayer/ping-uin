name: release

# Build native binaries for macOS, Linux, and Windows on every `v*` tag.
# These artifacts are what the packagers (Homebrew tap + winget) consume.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple silicon)
          - name: macos-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          # macOS (Intel) — cross-compile on Apple silicon runner to avoid macos-13 queues
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
          # Linux x64
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Windows x64
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      # macOS/Linux: tar.gz with binary + LICENSE
      - name: Package unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp target/${{ matrix.target }}/release/ping-uin dist/staging/ping-uin
          cp LICENSE dist/staging/LICENSE
          tar -C dist/staging -czf "dist/ping-uin-${{ matrix.name }}.tar.gz" .
          cd dist && shasum -a 256 "ping-uin-${{ matrix.name }}.tar.gz" > "ping-uin-${{ matrix.name }}.tar.gz.sha256"

      # Windows: zip with binary + LICENSE
      - name: Package windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/ping-uin.exe", "LICENSE" `
            -DestinationPath "dist/ping-uin-${{ matrix.name }}.zip"
          $hash = Get-FileHash -Path "dist/ping-uin-${{ matrix.name }}.zip" -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "dist/ping-uin-${{ matrix.name }}.zip.sha256" -NoNewline

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: dist/

      - name: Generate release notes checksums
        shell: bash
        run: |
          echo "## SHA-256 Checksums" > checksums.md
          echo "" >> checksums.md
          echo '```' >> checksums.md
          cat dist/*/*.sha256 >> checksums.md
          echo '```' >> checksums.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: checksums.md
          files: |
            dist/macos-aarch64/ping-uin-*.tar.gz
            dist/macos-aarch64/ping-uin-*.tar.gz.sha256
            dist/macos-x86_64/ping-uin-*.tar.gz
            dist/macos-x86_64/ping-uin-*.tar.gz.sha256
            dist/linux-x86_64/ping-uin-*.tar.gz
            dist/linux-x86_64/ping-uin-*.tar.gz.sha256
            dist/windows-x86_64/ping-uin-*.zip
            dist/windows-x86_64/ping-uin-*.zip.sha256
