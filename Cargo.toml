[package]
name = "ping-uin"
version = "0.2.13"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
csv = "1.3"
dirs = "5"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
getrandom = "0.2"

[package.metadata.deb]
maintainer = "altosaxplayer <https://github.com/altosaxplayer>"
copyright = "2026, altosaxplayer <https://github.com/altosaxplayer>"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """
A btop-style terminal UI for monitoring hosts.
Pings (or TCP-checks) your devices on per-host intervals and shows the
results in a rolling terminal interface, with an optional read-only LAN
status page and bidirectional sync between paired devices.
"""
